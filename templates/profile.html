{% extends "base.html" %}{% block content %}<section class="heading"><small>FARMER RECORD</small><h1>My farm profile</h1><p>Store farm details for future analysis.</p></section><section class="panel"><form method="post" class="grid"><label>Phone (optional)<input name="phone" value="{{profile.get('phone','')}}" maxlength="30"></label><label>State<input name="state" value="{{profile.get('state','')}}" maxlength="80"></label><label>District<input name="district" value="{{profile.get('district','')}}" maxlength="80"></label><label>Village<input name="village" value="{{profile.get('village','')}}" maxlength="100"></label><label>Farm size (acres)<input name="farm_size_acres" type="number" min="0" step="any" value="{{profile.get('farm_size_acres','')}}"></label><label>Soil type<select name="soil_type">{% for x in ['','Black','Alluvial','Red','Laterite','Sandy','Loamy','Clay','Other'] %}<option {% if profile.get('soil_type')==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Irrigation<select name="irrigation">{% for x in ['','Rainfed','Limited','Reliable'] %}<option {% if profile.get('irrigation')==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><button class="primary">Save profile</button></form><p class="muted">Database: {{mongo_status}}</p></section>{% endblock %}
